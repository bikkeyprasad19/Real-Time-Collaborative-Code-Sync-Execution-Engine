<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug - CodeSync</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .status { margin: 10px 0; padding: 10px; background: #252526; border-radius: 4px; }
    .success { color: #4ec9b0; }
    .error { color: #f48771; }
    .loading { color: #dcdcaa; }
  </style>
</head>
<body>
  <h1>CodeSync Diagnostics</h1>
  <div id="output"></div>

  <script>
    const output = document.getElementById('output');

    function log(message, type = 'loading') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      output.appendChild(div);
      console.log(message);
    }

    log('Starting diagnostics...');

    // Test Socket.io CDN
    const socketScript = document.createElement('script');
    socketScript.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
    socketScript.onload = () => {
      log('✓ Socket.io CDN loaded', 'success');

      // Test Socket connection
      try {
        const socket = io('http://localhost:3000');
        socket.on('connect', () => {
          log('✓ Socket.io connected to server', 'success');
        });
        socket.on('connect_error', (err) => {
          log(`✗ Socket.io connection error: ${err.message}`, 'error');
        });
      } catch (err) {
        log(`✗ Socket.io initialization error: ${err.message}`, 'error');
      }
    };
    socketScript.onerror = () => {
      log('✗ Failed to load Socket.io from CDN', 'error');
    };
    document.head.appendChild(socketScript);

    // Test Monaco Editor CDN
    const monacoLoader = document.createElement('script');
    monacoLoader.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js';
    monacoLoader.onload = () => {
      log('✓ Monaco Editor loader loaded', 'success');

      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });

      log('Loading Monaco Editor main module...');
      require(['vs/editor/editor.main'], function () {
        log('✓ Monaco Editor main module loaded', 'success');
        log('✓ All dependencies loaded successfully!', 'success');

        setTimeout(() => {
          log('You can now try the main app at http://localhost:3000', 'success');
        }, 1000);
      }, function(err) {
        log(`✗ Monaco Editor loading error: ${err}`, 'error');
      });
    };
    monacoLoader.onerror = () => {
      log('✗ Failed to load Monaco Editor loader from CDN', 'error');
    };
    document.head.appendChild(monacoLoader);

    // Test server API
    fetch('http://localhost:3000/api/health')
      .then(res => res.json())
      .then(data => {
        log(`✓ Server API responding: ${JSON.stringify(data)}`, 'success');
      })
      .catch(err => {
        log(`✗ Server API error: ${err.message}`, 'error');
      });
  </script>
</body>
</html>
